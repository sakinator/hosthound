<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="100%" height="100%">
  <defs>
    <!-- Filter for subtle tactile pop shadow -->
    <filter id="popShadow" x="-20%" y="-20%" width="150%" height="150%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.65"/>
      <feDropShadow dx="0" dy="4" stdDeviation="24" flood-color="#FF1482" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Deep OLED Black Background -->
  <rect width="1024" height="1024" fill="#000000" rx="192"/>

  <!-- Left Pillar: Cobalt Blue with slightly rounded corners -->
  <rect x="294" y="267" width="136" height="490" rx="32" fill="#1C6CF5"/>

  <!-- Right Pillar: Poppy Orange with slightly rounded corners -->
  <rect x="594" y="267" width="136" height="490" rx="32" fill="#F85618"/>

  <!-- Play Button: Popping Neon Pink with rounded vertices and tactile lift -->
  <path d="M 436 380 
           Q 428 385 428 395 
           L 428 629 
           Q 428 639 436 644 
           Q 444 648 452 642 
           L 656 525 
           Q 668 518 656 511 
           L 452 382 
           Q 444 376 436 380 Z" 
        fill="#FF1482" 
        filter="url(#popShadow)"/>
</svg>
