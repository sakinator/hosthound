name: Build Releases (Android APK & Windows Executable)

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    name: Build Android APK (TV & Mobile)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.3'
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        working-directory: android_app
        run: flutter pub get

      - name: Build Android Release APK
        working-directory: android_app
        run: |
          flutter build apk --release
          cp build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/hostreamio.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: hostreamio-apk
          path: android_app/build/app/outputs/flutter-apk/hostreamio.apk
          if-no-files-found: error

  build-windows:
    name: Build Windows Standalone Executable
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up Dart SDK
        uses: dart-lang/setup-dart@v1
        with:
          sdk: stable

      - name: Install Dependencies
        run: dart pub get

      - name: Compile Windows Standalone Executable
        run: dart compile exe bin/server.dart -o hostreamio.exe

      - name: Inject Application Icon
        shell: powershell
        run: |
          if (Test-Path "tool/rcedit.exe") {
            & "tool/rcedit.exe" hostreamio.exe --set-icon hostreamio.ico
          }

      - name: Package Windows Release Archive
        shell: powershell
        run: |
          New-Item -ItemType Directory -Path dist -Force
          Copy-Item hostreamio.exe dist/
          Copy-Item hostreamio.ico dist/ -ErrorAction SilentlyContinue
          Copy-Item hostreamio_logo.png dist/ -ErrorAction SilentlyContinue
          Copy-Item README.md dist/ -ErrorAction SilentlyContinue
          Copy-Item start.bat dist/ -ErrorAction SilentlyContinue
          Copy-Item start.ps1 dist/ -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Path dist/data -Force
          Copy-Item data/badges.json dist/data/ -ErrorAction SilentlyContinue
          Copy-Item data/config.json dist/data/ -ErrorAction SilentlyContinue
          Compress-Archive -Path dist/* -DestinationPath hostreamio-windows-x64.zip -Force

      - name: Upload Windows Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: hostreamio-windows
          path: |
            hostreamio.exe
            hostreamio-windows-x64.zip
          if-no-files-found: error

  release:
    name: Publish Release (Android & Windows)
    needs: [build-android, build-windows]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - name: Download Android Artifact
        uses: actions/download-artifact@v4
        with:
          name: hostreamio-apk
          path: release-assets/

      - name: Download Windows Artifact
        uses: actions/download-artifact@v4
        with:
          name: hostreamio-windows
          path: release-assets/

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release-assets/hostreamio.apk
            release-assets/hostreamio-windows-x64.zip
            release-assets/hostreamio.exe
          name: Release ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
